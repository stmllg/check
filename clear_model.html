<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>背書助手・模型管理</title><style>body{font:20px/1.6 system-ui,sans-serif;background:#f5f7fa;color:#172332;margin:0}main{max-width:680px;margin:auto;padding:20px}h1{font-size:28px}button,a{display:block;box-sizing:border-box;width:100%;padding:16px;margin:14px 0;font:inherit;font-weight:bold;border:1px solid #8392a3;border-radius:12px;background:white;color:#172332;text-align:center}button.danger{background:#a51e25;color:white}button:disabled{opacity:.45}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:16px;border-radius:12px;font:17px/1.6 system-ui}small{font-size:17px}</style></head><body><main><h1>背書助手・模型管理</h1><p>請先關閉其他背書助手頁面及主畫面捷徑中的程式。此工具只清除背書助手模型，不清除歡喜背書、福慧幣或進度。</p><button id="scan">檢查本機模型</button><pre id="out" role="status" aria-live="polite">尚未檢查</pre><button class="danger" id="del" disabled>清除背書助手全部本機模型</button><small>包含舊大模型及已下載的小模型；下次開啟須重新下載。請保持網路連線。</small><a href="./index.html">返回背書助手</a></main><script>
'use strict';const out=document.getElementById('out'),scan=document.getElementById('scan'),del=document.getElementById('del');const base=new URL('./',location.href);const names=['web01-manifest.json','check-active-manifest-v2.json'];const cacheNames=['recite-web0393-shell-v1','recite-web0393-shell-model-v2'];const owned=(n,h)=>h.kind==='file'?names.includes(n):/^(recite-|check-model-)[a-zA-Z0-9_.-]+$/.test(n);let running=false;
async function size(h){if(h.kind==='file')return (await h.getFile()).size;let n=0;for await(const child of h.values())n+=await size(child);return n;}
async function inspect(){if(location.protocol!=='https:'||!base.pathname.endsWith('/check/'))throw Error('請將此網頁放在 GitHub Pages 的 check 根目錄並以 HTTPS 開啟。');if(!navigator.storage?.getDirectory)throw Error('此瀏覽器不支援 OPFS。');const root=await navigator.storage.getDirectory(),items=[],entries=[];for await(const [n,h] of root.entries())if(owned(n,h))items.push({n,h,bytes:await size(h)});if('caches' in window){for(const name of await caches.keys()){if(!cacheNames.includes(name))continue;const c=await caches.open(name);for(const req of await c.keys()){const u=new URL(req.url);if(u.origin===base.origin&&(u.pathname.startsWith(base.pathname+'models/')||u.pathname.startsWith(base.pathname+'engine/')))entries.push({name,req});}}}return {root,items,entries};}
function show(s){const total=s.items.reduce((a,x)=>a+x.bytes,0);out.textContent=(s.items.length?s.items.map(x=>x.n+'\n'+(x.bytes/1048576).toFixed(2)+' MiB').join('\n\n'):'沒有背書助手 OPFS 模型')+'\n\n合計：'+(total/1048576).toFixed(2)+' MiB\n模型／引擎快取：'+s.entries.length+' 筆';del.disabled=!(s.items.length||s.entries.length);}
async function run(remove){if(running)return;running=true;scan.disabled=del.disabled=true;try{let s=await inspect();if(remove){if(!confirm('確定清除背書助手所有本機模型？下次使用需要重新下載。')){show(s);return;}const errors=[];for(const x of s.items){try{await s.root.removeEntry(x.n,{recursive:x.h.kind==='directory'});}catch(e){errors.push(x.n+'：'+e.message);}}for(const x of s.entries){try{await (await caches.open(x.name)).delete(x.req);}catch(e){errors.push(x.req.url+'：'+e.message);}}s=await inspect();show(s);out.textContent+=(errors.length||s.items.length||s.entries.length?'\n\n尚未完全清除，請關閉其他背書助手頁面後再試。':'\n\n清除完成！')+(errors.length?'\n'+errors.join('\n'):'');}else show(s);}catch(e){out.textContent='無法完成：'+e.message;}finally{running=false;scan.disabled=false;}}
scan.onclick=()=>run(false);del.onclick=()=>run(true);run(false);
</script></body></html>
