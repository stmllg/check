<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>背書助手｜逐字紅點測試 V02</title><style>
body{font:20px system-ui,sans-serif;margin:20px;background:#fffdf5;color:#242424}button,select,input{font:inherit;margin:5px;padding:10px}#verse{position:relative;line-height:2.3;font-size:clamp(26px,5vw,48px);padding:10px 0;overflow-wrap:anywhere}#verse span{display:inline-block;position:relative}#dot{position:absolute;width:10px;height:10px;background:#e22;border-radius:50%;pointer-events:none;left:0;top:0;transform:translate(-50%,-50%)}#status,#diag{font-size:18px;overflow-wrap:anywhere}button:disabled{opacity:.45}</style><h2>逐字小紅點測試 V02</h2><div><button id="load">準備模型</button><button id="start" disabled>開始念誦</button><button id="stop" disabled>停止</button><button id="report">輸出測試報告</button></div><div><select id="book"><option value="">預設經文</option></select><input id="file" type="file" accept=".json"><button id="prev">上一句</button><button id="next">下一句</button></div><div id="status">請準備模型</div><div id="verse"></div><div id="diag"></div><script src="recite-core.js"></script><script>
const $=x=>document.getElementById(x), now=()=>performance.now();let rows=[],dict={},worker,ready=false,running=false,ctx,media,node,epoch=0,sid=0,shown=-1,core,armed=false,events=[],visual=[],raf=0,pos=null,target=null,holdUntil=0,anim=null,displayBusy=false,lastTime=null,lastHeard=0,packetCount=0;const log=(type,data={})=>events.push({type,at:now(),...data});const clean=Recite.clean;
function validate(raw){const a=Array.isArray(raw)?raw:raw.sentences?.map(x=>({original:x.text,pinyin_syllables:x.pinyin_syllables,type:'scripture',sentence_id:x.id}));if(!Array.isArray(a))throw Error('教材格式錯誤');const b=a.filter(x=>x.type!=='heading');if(!b.length||b.some(x=>!x.original||!Array.isArray(x.pinyin_syllables)||x.pinyin_syllables.length!==clean(x.original).length))throw Error('需要完整拼音教材');return b;}
let cursor=1,goal=1,pace=250,frameTime=null,passed=false,tailStart=null,nextShown=null,lastLogged=1;
function render(i){shown=i;const v=$('verse');v.replaceChildren();for(const c of rows[i].original){const s=document.createElement('span');s.textContent=c;if(clean(c))s.dataset.word='1';v.append(s);}const d=document.createElement('i');d.id='dot';v.append(d);cursor=goal=lastLogged=1;pos=point(1);draw();log('display',{sid:i});}
function point(n){const v=$('verse'),a=[...v.querySelectorAll('[data-word]')],s=a[Math.max(0,Math.min(a.length-1,n-1))];return s?{x:s.offsetLeft+s.offsetWidth/2,y:s.offsetTop+s.offsetHeight*.78}: {x:0,y:0};}
function draw(){const d=$('dot');if(d&&pos){d.style.left=pos.x+'px';d.style.top=pos.y+'px';}}
function clearVisual(){cancelAnimationFrame(raf);raf=0;frameTime=null;passed=false;tailStart=null;nextShown=null;goal=cursor;}
function wake(){if(!raf){frameTime=null;raf=requestAnimationFrame(tick);}}
function tick(t){raf=0;const dt=frameTime===null?0:Math.min(50,t-frameTime);frameTime=t;cursor=Math.min(goal,cursor+dt/pace);const lo=Math.floor(cursor),hi=Math.ceil(cursor),f=cursor-lo,a=point(lo),b=point(hi);pos={x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f};draw();if(lo>lastLogged){lastLogged=lo;log('dot-arrived',{sid:shown,word:lo});}if(passed&&cursor>=goal){if(tailStart===null){tailStart=t;log('tail-hold',{sid:shown});}if(t-tailStart>=300){const next=nextShown;clearVisual();if(next!==null&&running){render(next);reset(next,false);$('status').textContent='請開始念誦';}else if(running){running=false;worker.postMessage({type:'block',epoch:++epoch});release();$('status').textContent='全部完成';}return;}}if(cursor<goal||passed)raf=requestAnimationFrame(tick);else frameTime=null;}
function reset(i,replay=false){sid=i;epoch++;armed=false;core.reset();lastHeard=0;lastTime=null;worker.postMessage({type:'reset',epoch,sid,replay,clean:!replay,single:rows[sid].pinyin_syllables.length===1});}
function result(m){if(!running||!armed||passed)return;const row=rows[sid],r=core.decide(row,m.text,m.final,75,now());const ts=m.timestamps||[],tokens=m.tokens||[],count=clean(m.text).length,n=row.pinyin_syllables.length,word=Math.min(n,count);let stamp=null;if(ts.length===count&&(!tokens.length||tokens.every(x=>clean(x).length===1))){stamp=ts.at(-1);const gaps=[];for(let i=Math.max(1,ts.length-5);i<ts.length;i++){const d=(ts[i]-ts[i-1])*1000;if(d>=60&&d<=650)gaps.push(d);}if(count>lastHeard&&gaps.length){gaps.sort((a,b)=>a-b);const estimate=Math.max(120,Math.min(420,gaps[Math.floor(gaps.length/2)]));pace+=Math.max(-20,Math.min(20,(estimate-pace)*.25));}}log('recognition',{sid,text:m.text,timestamps:ts,tokens,alignment:r.alignment,score:r.score,action:r.action,word,stamp,pace,receivedAt:m.receivedAt,audioAt:m.audioAt});$('diag').textContent=`辨識：${m.text} ｜吐字：${count} ｜分數：${r.score} ｜每字：${Math.round(pace)}ms`;if(word>lastHeard){lastHeard=word;goal=Math.max(goal,word);wake();}if(r.action==='pass')pass();else if(r.action==='fail'){log('retry',{sid});clearVisual();render(sid);reset(sid);$('status').textContent='請重新念本句';}}
function pass(){if(passed)return;armed=false;passed=true;goal=rows[sid].pinyin_syllables.length;nextShown=sid+1<rows.length?sid+1:null;log('pass',{sid});wake();}
async function release(){media?.getTracks().forEach(t=>t.stop());if(ctx){await ctx.close().catch(()=>{});ctx=null;}$('start').disabled=!ready;$('stop').disabled=true;}
$('load').onclick=()=>{if(worker)return;worker=new Worker('worker2.js');worker.onmessage=({data:m})=>{if(m.type==='status')$('status').textContent=m.text;else if(m.type==='ready'){ready=true;$('start').disabled=false;$('status').textContent='模型準備完成';log('ready',m);}else if(m.type==='error'){ $('status').textContent=m.text;log('error',m);running=false;release();worker.terminate();worker=null;ready=false;$('start').disabled=true;}else if(m.epoch===epoch&&m.sid===sid){if(m.type==='armed')armed=true;else if(m.type==='result')result(m);else if(m.type==='voice-pass'&&running&&armed)pass();else if(m.type==='ack'&&++packetCount%10===0)log('audio',{level:m.level,latency:m.latency});}};worker.postMessage({type:'init'});};
$('start').onclick=async()=>{if(!ready||running||!rows.length)return;$('start').disabled=true;try{ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();media=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});await ctx.audioWorklet.addModule('pcm-worklet.js');node=new AudioWorkletNode(ctx,'pcm50');ctx.createMediaStreamSource(media).connect(node);node.connect(ctx.destination);clearVisual();render(sid);running=true;reset(sid);node.port.onmessage=({data:m})=>{if(running)worker.postMessage({type:'pcm',epoch,sid,at:performance.timeOrigin+now(),samples:m.samples},[m.samples.buffer]);};$('stop').disabled=false;$('status').textContent='請開始念誦';}catch(e){running=false;await release();$('status').textContent=e.message;}};
$('stop').onclick=()=>{running=false;worker?.postMessage({type:'block',epoch:++epoch});clearVisual();release();$('status').textContent='已停止';};function go(i){if(!rows.length)return;clearVisual();sid=Math.max(0,Math.min(rows.length-1,i));render(sid);if(running)reset(sid);}$('prev').onclick=()=>go(shown-1);$('next').onclick=()=>go(shown+1);function setRows(a){if(running)$('stop').click();rows=validate(a);go(0);}$('file').onchange=async()=>{try{setRows(JSON.parse(await $('file').files[0].text()));}catch(e){$('status').textContent=e.message;}};$('book').onchange=async()=>{try{const f=$('book').value;setRows(await (await fetch(f?'script/'+encodeURIComponent(f):'scripture.json')).json());}catch(e){$('status').textContent=e.message;}};$('report').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:'index2-V02',events},null,2)],{type:'application/json'}));a.download='index2-report.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};window.addEventListener('resize',()=>{if(shown>=0){const a=point(Math.floor(cursor)),b=point(Math.ceil(cursor)),f=cursor-Math.floor(cursor);pos={x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f};draw();}});(async()=>{try{dict=await (await fetch('pinyin.json')).json();core=new Recite.Core(dict);setRows(await (await fetch('scripture.json')).json());const r=await fetch('script/catalog.json');if(r.ok)for(const e of await r.json())$('book').add(new Option(e.name,e.file));}catch(e){$('status').textContent=e.message;}})();
</script></html>
