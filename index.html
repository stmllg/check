<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#C7EDCC"><link rel="manifest" href="manifest.webmanifest"><title>背書助手 WEB03.2</title><link rel="stylesheet" href="ui.css?v=032"><link rel="stylesheet" href="android.css"><link rel="stylesheet" href="apple.css"><script src="platform.js"></script><script src="recite-core.js" defer></script><script src="app.js?v=032" defer></script><script src="panel.js?v=032" defer></script></head><body>
<div id="lineWarning" hidden>請點 LINE 右上角選單，選擇「使用預設瀏覽器開啟」。此處不下載模型。</div>
<div id="portrait" hidden><div class="phone">▭</div><h1>請將手機橫放</h1><p>請先大乘發心，恭敬背誦。</p><p id="portraitHint" role="status"></p><button id="portraitSetup">大乘發心</button></div>
<div id="boot" role="status" aria-live="polite"><h1>背書助手 WEB03.2</h1><p id="bootText">正在準備背書…</p><progress id="bootProgress" max="1" value="0" hidden></progress><p>首次使用需下載模型，之後可離線背書。</p><button id="retryBoot" hidden>重新準備</button></div><main id="panel"><aside class="left"><button id="scriptKey">經文</button><button id="thresholdKey">辨識<br>70%</button><button id="reminderKey">通過<br>靜音</button><button id="displayKey">跟讀</button></aside>
<section id="middle"><header><span id="brand">背書助手 WEB03.2</span><span id="seq"></span></header><div id="status" role="status">正在準備背書…</div><div id="commandBanner" hidden role="status"><strong>請唸出：我要背書供養</strong><span id="commandHint">正在聆聽……</span><button id="commandCancel">取消</button></div><div id="reader" aria-label="經文五行"></div><div id="observer" hidden><small>紅字：完全同音　天空藍：近音　灰字：未匹配</small><div class="pair"><article id="previousObs"></article><article id="currentObs"></article></div></div><div id="review" hidden></div><div id="reportTools" hidden><button id="report">匯出測試報告</button><button id="copy">複製測試報告</button><textarea id="reportText" hidden readonly></textarea></div></section>
<aside class="right"><button id="actionKey" class="startKey" disabled>開始<br>背書</button><div class="slot"><button id="observerKey" class="observeKey" hidden>即時<br>觀察</button><button id="restartKey" class="restartKey" hidden>從頭<br>開始</button></div><div class="slot"><button id="continueKey" class="continueKey" hidden>持續<br>進度</button></div><div class="slot last"><button id="offeringKey">圓滿<br>供養</button><progress id="volume" value="0" max="100" aria-label="麥克風音量"></progress></div></aside></main>
<dialog id="scriptDialog"><h2>選擇經文</h2><div id="library"></div><label class="import">＋ 匯入 V500 經文 JSON<input id="file" type="file" accept=".json,application/json"></label><label>範圍 <select id="scope"><option value="all" selected>全部經文</option><option value="10">前十句（測試）</option></select></label><button data-close>取消／返回</button></dialog>
<dialog id="thresholdDialog"><h2>辨識基準門檻</h2><select id="threshold"><option>65</option><option selected>70</option><option>75</option><option>80</option></select><p>5～10字使用基準；超過10字每字加2個百分點（最高90%）。短句及咒語沿用原規則。</p><button data-close>確定</button></dialog>
<div id="setupDialog" hidden><h2>模型與測試資訊</h2><div id="setupStatus"></div><progress id="progress" max="1" value="0" hidden></progress><button id="load" hidden>準備辨識模型</button><div id="storage"></div><small id="offline"></small><details><summary>測試資訊</summary><div id="metrics">尚無數據</div><div id="stats"></div><div id="score"></div><div id="result"></div><div id="marked"></div><pre id="log"></pre></details></div>
<div hidden><div id="verse"></div><input id="muyu" type="checkbox"><button id="start"></button><button id="stop"></button><button id="prev"></button><button id="next"></button><button id="again"></button></div>
</body></html>
